    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var segments = (window.location.pathname || "/").split("/").filter(Boolean);
        var reserved = ["master", "sobre", "contatos", "admin", "assets", "docs", "api"];
        var slug = (segments[0] || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
        var startUrl = "/";

        if (slug === "master") {
          startUrl = "/master";
        } else if (slug && reserved.indexOf(slug) === -1) {
          startUrl = segments[1] === "admin" ? "/" + slug + "/admin/dashboard" : "/" + slug;
        }

        var manifest = document.createElement("link");
        manifest.id = "startt-manifest";
        manifest.rel = "manifest";
        manifest.href = "/api/site.webmanifest?start_url=" + encodeURIComponent(startUrl);
        document.head.appendChild(manifest);
      })();
    </script>
